<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Fruit Coop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game" aria-label="Fruit Coop playfield"></canvas>
  <div id="hud">
    <div id="score">0</div>
    <div id="lives" aria-label="Lives remaining">♥♥♥</div>
    <div id="message">Tap to start</div>
  </div>
  <div id="result" class="hidden" aria-live="polite">
    <div id="result-reason"></div>
    <div id="result-score">0</div>
    <div id="result-highscore"></div>
    <div id="result-hint">Tap to play again</div>
  </div>
  <div class="top-left">
    <button type="button" id="fullscreen" aria-label="Double-tap for fullscreen" title="Double-tap for fullscreen">
      <svg class="fs-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
    </button>
    <a class="back" href="../../">Games</a>
  </div>
  <script src="game.js"></script>
</body>
</html>
